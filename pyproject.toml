[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-riposte"
version = "0.2.0"
description = "Render an exact Git commit as one LLM-friendly Markdown document."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Jason Weirather" },
]
dependencies = [
  "click>=8.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Repository = "https://github.com/jason-weirather/repo-riposte"
Issues = "https://github.com/jason-weirather/repo-riposte/issues"

[project.scripts]
repo-riposte = "repo_riposte.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["repo_riposte*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
